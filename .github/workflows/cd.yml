name: CD

on:
  push:
    branches: [feature/production]

jobs:
  test:
    # Runner BTC (shared, FIFO) thay vi ubuntu-latest - Actions bi chan boi billing
    # loi cua to chuc (xem HUONG_DAN_DEPLOY_THU_CONG.md), self-hosted khong tinh
    # phi Actions minutes nen khong bi chan. Ca deploy-backend/deploy-frontend ben
    # duoi cung da doi - can Docker + Node co san tren runner BTC, chua tu kiem
    # chung duoc, se ro sau lan chay dau tien.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        # DATABASE_URL: file rieng cho CI, khong dinh Supabase/CockroachDB that -
        # da thu tro thang DB that (secret) nhung quyet dinh khong dung vi runner
        # BTC dung chung cho ca chuong trinh, test co insert/delete du lieu that
        # neu chua ro muc do co lap giua cac job cua cac team. Dung SQLite rieng,
        # tao moi moi lan chay (rm -f truoc khi chay vi self-hosted co the giu lai
        # workspace giua cac lan, khong dam bao sach nhu ubuntu-latest).
        run: |
          rm -f ci_test.db
          pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          DATABASE_URL: sqlite:///./ci_test.db
          DATABASE_URL_FACTS: ""

  deploy-backend:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/p-005-backend:latest

      - name: Trigger Render deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-frontend:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # Chay tu repo root (KHONG working-directory: frontend) - project Vercel da
      # cau hinh san rootDirectory: "frontend", chay CLI tu trong frontend/ se bi
      # cong don thanh frontend/frontend va khong tim thay package.json.
      #
      # Dung remote build (`vercel deploy --prod`) thay vi build local roi
      # `--prebuilt` nhu truoc - NEXT_PUBLIC_API_URL duoc danh dau "Sensitive" tren
      # Vercel nen CLI local/CI KHONG doc duoc gia tri that (build local se loi
      # "Invalid rewrite found" vi rewrite destination rong). Bien Sensitive chi
      # duoc resolve dung trong ha tang build cua chinh Vercel khi deploy remote.
      - name: Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
